# Daily Brief settings. Edit this file on GitHub (pencil icon) to change topics,
# feeds, voice or length. The next run picks up your changes automatically.

[show]
title = "Adrian's Daily Brief"
listener = "Adrian"                      # used in the greeting
author = "Adrian"
description = "A private daily brief: Australian and world news, football, and pro wrestling."
site_url = "https://abunoza98.github.io/podcast"
language = "en-au"
timezone = "Australia/Sydney"
category = "News"
subcategory = "Daily News"
keep_episodes = 14                       # older episodes are deleted to keep the site small
outro = "That's your brief. Have a good one."

[length]
# Roughly 900 spoken characters is one minute of audio.
# 7 stories x 750 characters is about six minutes.
target_chars_per_story = 750
min_chars_per_story = 550                # below this, the writer is asked to go deeper (once)
max_chars_per_story = 1100               # above this, the writer is asked to tighten (once)

[llm]
model = "openai/gpt-oss-120b"
fallback_models = ["llama-3.3-70b-versatile"]
reasoning_effort = "low"
tokens_per_minute = 8000                 # Groq free-tier limit for gpt-oss-120b
fact_check = true                        # second pass: checks each part against its sources and fixes what's wrong

# ---------------------------------------------------------------------------
# Things the writing model gets wrong from its out-of-date memory. Every writer and the fact
# checker see these. Add a line whenever the podcast states something stale.
# ---------------------------------------------------------------------------
[context]
facts = [
  "The Champions League, Europa League and Conference League have NO groups. Since 2024-25 each has a single 36-team league phase table. Teams play eight league-phase matches (six in the Conference League) against different opponents. The top eight go straight to the round of sixteen, ninth to twenty-fourth play a knockout play-off, and the rest are out. Say 'league phase', never 'group stage', 'group' or 'tops the group'.",
  "The Champions League league phase runs from September to late January; the knockout play-offs are in February.",
  "The 2026 men's World Cup (USA, Canada and Mexico, 48 teams) was played in June and July 2026. The 2027 Women's World Cup is in Brazil.",
  "Football's 2026-27 club season is under way.",
  "Never say where a team sits in a league table, or describe its season or form, unless the source text or results data says so.",
]

[voice]
engine = "elevenlabs"                    # "elevenlabs" or "kokoro" (free, runs on GitHub)
fallback_to_kokoro = true                # if ElevenLabs fails or runs out of credits, use Kokoro
elevenlabs_voice_id = "qCwgiN0GsIAYwAJ1nYvZ"
elevenlabs_model = "eleven_flash_v2_5"
elevenlabs_credits_per_char = 0.21        # only used for the cost estimate in the run log
kokoro_voice = "bm_george"               # British male. Others: bm_lewis, bm_daniel, bf_emma, bf_isabella
kokoro_lang = "b"                        # b = British English (closest to Australian)

[fetch]
lookback_hours = 30                      # only consider items published in this window
max_items_per_feed = 25
candidates_per_section = 12              # how many each section shows the editor model (a section can set its own "candidates")
editor_blurb_chars = 160                 # summary length per candidate; keeps the editor's request under Groq's free-tier limit
source_chars_per_story = 2400            # article text sent to the writer per story
# Headlines matching any of these (case-insensitive regex) are skipped before ranking.
skip_title_patterns = [
  "\\bquiz\\b", "crossword", "\\bpodcast\\b", "^watch:", "\\bas it happened\\b",
  "\\bhow to watch\\b", "\\bodds\\b", "\\bbetting\\b", "\\btips\\b", "\\bin pictures\\b",
  "\\bphotos?:", "\\bwordle\\b", "\\bhoroscope", "\\bsponsored\\b",
  "\\bpredictions?\\b", "\\bpreview\\b", "what channel", "live stream", "►", "injury report",
  "ratings$", "player ratings",
  # share-tip and stock-chatter sites that turn up in company searches
  "- Kalkine( Media)?$", "- Simply Wall St", "- MarketBeat$", "- The Motley Fool", "- TipRanks",
]

# ---------------------------------------------------------------------------
# Sections play in this order. "picks" is how many stories each gets.
# "brief" tells the editor model what to choose; "listener_note" tells the
# writer what Adrian already knows. Feeds marked ranked = true list stories
# in editorial order (most important first), which counts towards the score.
# weight > 1 trusts a source more; < 1 trusts it less.
# ---------------------------------------------------------------------------

[[sections]]
id = "news"
name = "News"
picks = 2
brief = """The two stories that matter most today: Australian news first, then the biggest \
global story. The Australian pick must be the story leading the Australian news this morning: \
the one at or near the top of ABC Top Stories and covered by several outlets. Breaking events \
always win over policy or economy stories: an attack on or death of a public figure, a terror \
attack, a major disaster, a big crime, or anything with lives at stake. A politician being \
attacked or hurt is a major national story, not niche politics. After that, favour things that \
change something for people in Australia, or that are the main story around the world. Skip \
niche regional politics, diplomacy and resource-deal stories (trade agreements, gas projects, \
treaty signings) unless they're front-page news here."""
listener_note = "Adrian lives in Sydney. He follows the news but hasn't read today's yet."
feeds = [
  { name = "ABC Top Stories", url = "https://www.abc.net.au/news/feed/10719986/rss.xml", ranked = true, weight = 1.3 },
  { name = "ABC Just In", url = "https://www.abc.net.au/news/feed/10719976/rss.xml" },
  { name = "ABC World", url = "https://www.abc.net.au/news/feed/104217382/rss.xml" },
  { name = "Guardian Australia", url = "https://www.theguardian.com/australia-news/rss", weight = 1.1 },
  { name = "SBS News", url = "https://www.sbs.com.au/news/topic/latest/feed" },
  { name = "BBC World", url = "https://feeds.bbci.co.uk/news/world/rss.xml", ranked = true, weight = 1.2 },
  { name = "Guardian World", url = "https://www.theguardian.com/world/rss" },
  { name = "Al Jazeera", url = "https://www.aljazeera.com/xml/rss/all.xml", weight = 0.9 },
]

[[sections]]
id = "payments"
name = "Payments"
picks = 2
brief = """The payments industry: card schemes, acquirers, processors and fintechs (Visa, \
Mastercard, American Express, Adyen, Stripe, Square, PayPal, Tyro, eftpos and the like), plus \
regulation that affects them (RBA surcharging and interchange reform, scheme fees, open banking). \
Favour Australian stories and big industry moves. Skip product puff pieces, partnership \
announcements with no real substance, and sponsored content."""
listener_note = "Adrian works full-time in the payments industry, so skip the basics of how cards and acquiring work. Do explain what a story means in practice for merchants and the industry."
feeds = [
  { name = "Payments Dive", url = "https://www.paymentsdive.com/feeds/news/", weight = 1.1 },
  { name = "Finextra", url = "https://www.finextra.com/rss/headlines.aspx" },
  { name = "PYMNTS", url = "https://www.pymnts.com/feed/", weight = 0.8 },
  { name = "Google News (AU payments)", url = "https://news.google.com/rss/search?q=(Visa+OR+Mastercard+OR+Amex+OR+Adyen+OR+Stripe+OR+Tyro+OR+eftpos+OR+surcharging)+when:2d&hl=en-AU&gl=AU&ceid=AU:en", weight = 1.2 },
]

[[sections]]
id = "clients"
name = "Company news"                    # neutral on purpose: it's what the chapter is called in the public notes
optional = true                          # silent on days with nothing worth knowing
style = "brief"
picks = 2
candidates = 8                           # the editor sees this section's top 8 stories
target_chars_per_story = 420
min_chars_per_story = 220
max_chars_per_story = 700
# The company list lives in a GitHub secret, never in this file: Settings → Secrets and variables
# → Actions → New repository secret, named CLIENT_WATCHLIST, one company per line. Add search terms
# after "=" for names that are common words or shared with other companies, for example:
#   Coles = "Coles Group" OR "Coles supermarkets"
# Nothing about this section is published: the script, run record, logs and state file leave it
# out, and its chapter is just called "Company news". No secret set = section off.
watchlist_secret = "CLIENT_WATCHLIST"
feeds = []                               # built from the secret
brief = """News about companies on Adrian's private watchlist (each candidate here came from a \
search for one of them). Pick a story only if it's worth knowing before a meeting with that \
company: financial results, guidance or a profit warning; a merger, acquisition, sale or big \
investment; a CEO, CFO, CTO or head of payments, digital or e-commerce change; layoffs or \
restructuring; a major outage, data breach or cyber attack; a regulator's action or fine; a big \
expansion, launch, store or market closure; or a change to how they sell or take payments \
(checkout, loyalty, buy now pay later, apps). Skip share-price moves on their own, analyst ratings \
and price targets, marketing campaigns, sponsorships, minor promotions, and stories that only \
mention the company in passing. Some searches include a company's brands (its stores, banners \
or insurance brands): brand news only counts when it affects the business nationally, so skip \
single-store or local stories (one store opening or closing, a local robbery, fire, community \
event or sponsorship). Check the story is really about that company and not one with a similar \
name or acronym. Don't pick a story already picked for another section."""
listener_note = "Adrian works with these companies in his day job in payments, so he wants what's useful to know before talking to them: what happened and what it could mean for them, especially their payments, checkout or customers. Never call them his clients, never mention his employer, and never speculate about his work with them: just report the company news."

[[sections]]
id = "sport"
name = "Football and sport"
picks = 2
brief = """Scores are read out separately in a scores roundup just before this, so pick stories \
that go beyond the scoreline: standout performances, managers, injuries, transfers and title races. \
Football (soccer) first: the A-League, Socceroos, Matildas, and the biggest \
European and international stories. Other sports only when they have genuine global \
relevance, like a world title, a major record or a huge upset. Grand Slam tennis results \
(Australian Open, French Open, Wimbledon, US Open), men's and women's, are always worth a pick \
in the later rounds. Women's sport otherwise only when it's major football news: the Matildas \
(news, squads and fixtures) or Women's World Cup qualifying and results. Skip other women's \
club football, women's national teams other than the Matildas (including England manager or \
contract news), and other women's sport. Skip unconfirmed transfer rumours, routine match \
previews and fantasy content."""
listener_note = "Adrian follows football closely, so don't explain how football works. Say 'football' for soccer and name other codes (AFL, NRL) explicitly."
feeds = [
  { name = "BBC Football", url = "https://feeds.bbci.co.uk/sport/football/rss.xml", ranked = true, weight = 1.2 },
  { name = "Guardian Football", url = "https://www.theguardian.com/football/rss", weight = 1.1 },
  { name = "Guardian A-League", url = "https://www.theguardian.com/football/a-league/rss", weight = 1.2 },
  { name = "Guardian Australia Sport", url = "https://www.theguardian.com/sport/australia-sport/rss" },
  { name = "Sky Sports Football", url = "https://www.skysports.com/rss/11095" },
  { name = "ABC Sport", url = "https://www.abc.net.au/news/feed/103728570/rss.xml" },
  { name = "BBC Sport", url = "https://feeds.bbci.co.uk/sport/rss.xml", ranked = true, weight = 0.9 },
]

[[sections]]
id = "teams"
name = "Your teams"
optional = true                          # usually silent: only plays when something clears the bar
style = "brief"                          # short items, two to four sentences each
picks = 3                                # at most this many on a busy day
target_chars_per_story = 380
min_chars_per_story = 200
max_chars_per_story = 650
brief = """Match scores for Man City, the Chiefs, the Celtics, Croatia and Dinamo's European games \
are read out separately in a scores roundup, so for those pick stories beyond the scoreline. Dinamo's Croatian \
league (HNL) results are NOT in that roundup, so always pick a report of Dinamo's latest league \
match when there is one. \
Adrian's teams and interests: Dinamo Zagreb and Croatian football (the national team, \
the HNL, Croatian players abroad), the Kansas City Chiefs, big league-wide NFL news, the Boston \
Celtics, big league-wide NBA news (blockbuster trades, major injuries to stars, coaching changes, \
records, award winners, the playoffs and Finals), Manchester City, the St George Illawarra \
Dragons, and Eurovision. Pick a story only if it's a result of a \
game his team played, or genuinely good to know: a title, trophy or big win or loss, a major \
signing, sale, injury or coach change, a big announcement, or for Eurovision major news like \
hosts, entries, songs and results. Skip previews, rumours, minor squad news, opinion and \
fan-site filler. Don't repeat a story already picked for another section. Some headlines are in Croatian: that's \
fine, but write the label in English."""
listener_note = "Adrian is a fan of all of these, so talk to him like one. He follows them but hasn't seen today's news. Some sources are in Croatian: always speak in English."
feeds = [
  { name = "Google News: Dinamo Zagreb", url = "https://news.google.com/rss/search?q=%22Dinamo+Zagreb%22+when:2d&hl=en-AU&gl=AU&ceid=AU:en" },
  { name = "Google News: Croatian football", url = "https://news.google.com/rss/search?q=Dinamo+OR+Hajduk+OR+HNL+OR+reprezentacija+when:2d&hl=hr&gl=HR&ceid=HR:hr", weight = 0.8 },
  { name = "Google News: Croatia national team", url = "https://news.google.com/rss/search?q=%22Croatia%22+football+OR+Modric+OR+Gvardiol+when:2d&hl=en-AU&gl=AU&ceid=AU:en", weight = 0.8 },
  { name = "Google News: Kansas City Chiefs", url = "https://news.google.com/rss/search?q=%22Kansas+City+Chiefs%22+when:2d&hl=en-US&gl=US&ceid=US:en" },
  { name = "Guardian NFL", url = "https://www.theguardian.com/sport/nfl/rss", weight = 0.9 },
  { name = "CBS Sports NFL", url = "https://www.cbssports.com/rss/headlines/nfl/", weight = 0.8 },
  { name = "Google News: Boston Celtics", url = "https://news.google.com/rss/search?q=%22Boston+Celtics%22+when:2d&hl=en-US&gl=US&ceid=US:en" },
  { name = "CelticsBlog", url = "https://www.celticsblog.com/rss/current.xml", weight = 0.8 },
  { name = "Yahoo Sports NBA", url = "https://sports.yahoo.com/nba/rss.xml", weight = 0.9 },
  { name = "CBS Sports NBA", url = "https://www.cbssports.com/rss/headlines/nba/", weight = 0.8 },
  { name = "BBC Man City", url ="https://feeds.bbci.co.uk/sport/football/teams/manchester-city/rss.xml", weight = 1.1 },
  { name = "Guardian Man City", url = "https://www.theguardian.com/football/manchestercity/rss" },
  { name = "Google News: St George Dragons", url = "https://news.google.com/rss/search?q=%22St+George+Illawarra%22+OR+%22Dragons%22+NRL+when:2d&hl=en-AU&gl=AU&ceid=AU:en" },
  { name = "Google News: Eurovision", url = "https://news.google.com/rss/search?q=Eurovision+when:2d&hl=en-AU&gl=AU&ceid=AU:en", weight = 0.9 },
  { name = "ESCXtra (Eurovision)", url = "https://escxtra.com/feed/", weight = 0.9 },
  { name = "Eurovoix (Eurovision)", url = "https://eurovoix.com/feed/", weight = 0.9 },
]

[[sections]]
id = "wrestling"
name = "Pro wrestling"
style = "roundup"                        # one combined segment instead of separate stories
picks = 4                                # how many items feed the roundup
roundup_chars = 1600                     # about two minutes
source_chars_per_story = 1400
brief = """Pro wrestling: WWE, AEW and other major promotions. Pick the items that together give \
the best overall picture of the last day in wrestling: the biggest televised show or premium \
live event (Raw, SmackDown, NXT, Dynamite, Collision, PLEs and pay-per-views, including the main \
event), the other notable results, the main storylines and where feuds are heading, and \
confirmed news (title changes, signings, departures, injuries, big announcements). Skip house \
shows, non-televised live events, tour stops and indie appearances, unless something there is \
genuinely major (a title change or a serious injury). The SquaredCircle Reddit items show what \
fans are talking about overnight: treat a story that's big there as more important, but never \
pick memes, clips, polls, fan opinion or 'what if' threads, and only use a Reddit item if it \
reports real news. Avoid two items about the same match. Skip speculation, reaction pieces, \
predictions and ratings columns."""
listener_note = "Adrian is a wrestling fan and knows the major promotions, shows and names. He doesn't care about house shows."
skip_title_patterns = [
  "\\bhouse show\\b", "\\blive event\\b", "\\bdark match", "discussion thread", "\\bmeme\\b",
  "\\bgif\\b", "\\bpoll\\b", "^\\[?(serious|humor|humour|shitpost)",
]
feeds = [
  { name = "Reddit r/SquaredCircle (top today)", url = "https://www.reddit.com/r/SquaredCircle/top/.rss?t=day&limit=25", ranked = true, weight = 0.7 },
  { name = "F4W / Wrestling Observer", url = "https://www.f4wonline.com/feed/", weight = 1.2 },
  { name = "POST Wrestling", url = "https://www.postwrestling.com/feed/", weight = 1.2 },
  { name = "PWTorch", url = "https://www.pwtorch.com/site/feed/", weight = 1.1 },
  { name = "Wrestling Inc", url = "https://www.wrestlinginc.com/feed/", weight = 0.9 },
  { name = "Wrestleview", url = "https://www.wrestleview.com/feed/", weight = 0.9 },
]

# ---------------------------------------------------------------------------
# Your Fantasy Premier League team. Find the ID in your team's address on the
# FPL site: fantasy.premierleague.com/entry/1234567/event/8 → team_id = 1234567
# ---------------------------------------------------------------------------
[fpl]
enabled = true
team_id = 1632250                              # 0 = segment off until you add your ID
after_section = "teams"                  # plays straight after this section
segment_chars = 1000                     # about a minute when everything is due
remind_hours_before_deadline = 36        # deadline reminder this close to the deadline
# Transfer ideas: like-for-like swaps (defender for defender etc.) that fit your bank, the
# three-per-club rule and your free transfers, based on form, FPL's expected points and the
# next few fixtures. When: "deadline" (with the deadline reminder), "recap" (after a gameweek
# finishes), "both", or "off".
transfer_ideas = "deadline"
transfer_lookahead = 3                   # how many upcoming gameweeks of fixtures to weigh up
max_transfer_ideas = 2                   # never more than this, and never more than your free transfers (min 1)
transfer_min_gain = 1.5                  # how much better a replacement must be to be worth suggesting
transfer_min_minutes = 270               # ignore players who've barely played this season

# ---------------------------------------------------------------------------
# Scores roundup: results of games finished since the last episode, read out
# just before the football stories. mode = "all" reads every result,
# "notable" only big ones, "teams" only games involving follow_teams.
# ---------------------------------------------------------------------------
[results]
enabled = true
before_section = "sport"
follow_teams = ["Dinamo Zagreb", "Manchester City", "Croatia", "Kansas City Chiefs", "Boston Celtics"]
chars_per_result = 110
leagues = [
  { name = "Premier League", path = "soccer/eng.1", mode = "all" },
  { name = "La Liga", path = "soccer/esp.1", mode = "notable" },
  { name = "Serie A", path = "soccer/ita.1", mode = "notable" },
  { name = "Bundesliga", path = "soccer/ger.1", mode = "notable" },
  { name = "Ligue 1", path = "soccer/fra.1", mode = "notable" },
  { name = "Champions League", path = "soccer/uefa.champions", mode = "notable" },
  { name = "Europa League", path = "soccer/uefa.europa", mode = "teams" },
  { name = "Conference League", path = "soccer/uefa.europa.conf", mode = "teams" },
  { name = "A-League Men", path = "soccer/aus.1", mode = "notable" },
  { name = "Nations League", path = "soccer/uefa.nations", mode = "teams" },
  { name = "NFL", path = "football/nfl", mode = "notable" },
  { name = "NBA", path = "basketball/nba", mode = "notable" },
]
